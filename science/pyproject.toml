[project]
name = "siterra-science"
version = "0.1.0"
description = "Offline pipeline that builds Siterra's observation bundles (STAC static catalog) from CHIRPS v3.0 and Sentinel-2 L2A"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.4",
    "rasterio==1.5.2",
    "pyproj==3.8.0",
    "shapely==2.2.0",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "pillow==12.3.0",
    "affine==3.0.1",
]

[tool.uv]
package = false
exclude-newer = "2026-10-14T00:00:00Z"
